name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test:run

    - name: Build web
      run: npm run build

    - name: Build core bundle for iOS (JavaScriptCore)
      run: npm run build:jsc -w @catlog/core

    - name: Check iOS core bundle is up to date
      run: |
        npm run build:ios -w @catlog/core
        git diff --exit-code -- apps/ios/CatLogKit/Sources/CatLogKit/Resources/catlog-core.js \
          || (echo "::error::apps/ios 的 catlog-core.js 過期，請執行 npm run build:ios -w @catlog/core 並 commit" && exit 1)

    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=high
