version: 2
updates:
  # 只自動處理 minor / patch，並合併成一個 PR；大版本升級（React、Vite、Firebase、husky 等）
  # 需要搭配相關套件一起調整與實測，改為手動規劃。安全性修補仍會由 Dependabot security updates 另外開 PR。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
