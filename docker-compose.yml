name: catlog

services:
  web:
    build: .
    ports:
      # Localhost only: keep the dev server off the LAN.
      - "127.0.0.1:3002:3002"
    volumes:
      # Live-edit source from the host; Vite also reads .env from here.
      - .:/app
      # Keep the container's Linux node_modules separate from the host.
      - node_modules:/app/node_modules
    environment:
      HUSKY: "0"

volumes:
  node_modules:
